name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project (works with any folder or an uploaded zip)
        id: p
        run: |
          f=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$f" ]; then
            z=$(find . -iname '*.zip' -not -path './.git/*' | head -n1)
            if [ -n "$z" ]; then
              mkdir -p _src && unzip -q -o "$z" -d _src
              f=$(find _src -name settings.gradle | head -n1)
            fi
          fi
          if [ -z "$f" ]; then
            echo "settings.gradle not found in repository"; ls -R | head -50; exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project dir: $(dirname "$f")"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: PulseFX
          path: |
            ${{ steps.p.outputs.dir }}/build/libs/*.jar
            !${{ steps.p.outputs.dir }}/build/libs/*-sources.jar
            !${{ steps.p.outputs.dir }}/build/libs/*-dev.jar
